<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="52" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Where each rate limiter runs, and where its counter lives</text>

  <!-- ====== Request path (top band) ====== -->
  <text x="60" y="118" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">REQUEST PATH</text>

  <!-- Clients -->
  <rect x="60" y="140" width="180" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Clients</text>
  <text x="150" y="216" text-anchor="middle" font-size="15" fill="#475569">10,000 req / s</text>

  <!-- APIM -->
  <rect x="330" y="140" width="290" height="110" rx="14" fill="#ecfeff" stroke="#0d9488" stroke-width="3"/>
  <text x="475" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">API Management</text>
  <text x="475" y="206" text-anchor="middle" font-size="15" fill="#475569">Basic v2 gateway</text>
  <text x="475" y="230" text-anchor="middle" font-size="15" fill="#475569">sets X-Client-Id = subscription</text>

  <!-- API replicas -->
  <rect x="730" y="122" width="290" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="720" y="131" width="290" height="110" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="3"/>
  <rect x="710" y="140" width="290" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="855" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ASP.NET Core API</text>
  <text x="855" y="206" text-anchor="middle" font-size="15" fill="#475569">Container Apps, .NET 8</text>
  <text x="855" y="230" text-anchor="middle" font-size="15" fill="#475569">2 replicas</text>

  <!-- Downstream -->
  <rect x="1090" y="140" width="250" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1215" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Slow backend</text>
  <text x="1215" y="216" text-anchor="middle" font-size="15" fill="#475569">250 ms per call</text>

  <!-- arrows -->
  <line x1="240" y1="195" x2="326" y2="195" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="195" x2="706" y2="195" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="195" x2="1086" y2="195" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ====== Limiter cards ====== -->
  <text x="60" y="318" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">LIMITERS AT THIS HOP</text>

  <!-- connector lines from hops to cards -->
  <line x1="475" y1="250" x2="475" y2="336" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="855" y1="250" x2="855" y2="336" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="1215" y1="250" x2="1215" y2="336" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Gateway card -->
  <rect x="330" y="340" width="290" height="230" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <rect x="330" y="340" width="290" height="44" rx="14" fill="#0d9488"/>
  <rect x="330" y="370" width="290" height="14" fill="#0d9488"/>
  <text x="475" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">GATEWAY: no code, policy XML</text>
  <text x="352" y="418" font-size="17" fill="#0f172a">rate-limit-by-key</text>
  <text x="352" y="440" font-size="14" fill="#64748b">classic: sliding window · v2: token bucket</text>
  <text x="352" y="474" font-size="17" fill="#0f172a">limit-concurrency</text>
  <text x="352" y="496" font-size="14" fill="#64748b">in-flight calls to the backend</text>
  <text x="352" y="530" font-size="17" fill="#0f172a">llm-token-limit</text>
  <text x="352" y="552" font-size="14" fill="#64748b">tokens, not requests, for AI backends</text>

  <!-- Service card -->
  <rect x="710" y="340" width="290" height="230" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="710" y="340" width="290" height="44" rx="14" fill="#2563eb"/>
  <rect x="710" y="370" width="290" height="14" fill="#2563eb"/>
  <text x="855" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">SERVICE: RateLimiter per client</text>
  <text x="732" y="414" font-size="14" font-weight="700" fill="#2563eb">BUILT INTO .NET</text>
  <text x="732" y="438" font-size="17" fill="#0f172a">fixed window · sliding window</text>
  <text x="732" y="462" font-size="17" fill="#0f172a">token bucket · concurrency</text>
  <text x="732" y="500" font-size="14" font-weight="700" fill="#2563eb">CUSTOM IN THIS REPO</text>
  <text x="732" y="524" font-size="17" fill="#0f172a">sliding window log</text>
  <text x="732" y="548" font-size="17" fill="#0f172a">leaky bucket</text>

  <!-- Downstream card -->
  <rect x="1090" y="340" width="250" height="230" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="1090" y="340" width="250" height="44" rx="14" fill="#64748b"/>
  <rect x="1090" y="370" width="250" height="14" fill="#64748b"/>
  <text x="1215" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">WHAT NEEDS PROTECTING</text>
  <text x="1215" y="430" text-anchor="middle" font-size="17" fill="#0f172a">Too many calls in flight,</text>
  <text x="1215" y="454" text-anchor="middle" font-size="17" fill="#0f172a">not too many per second.</text>
  <text x="1215" y="500" text-anchor="middle" font-size="15" fill="#475569">Guarded by the</text>
  <text x="1215" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">concurrency limiter</text>
  <text x="1215" y="544" text-anchor="middle" font-size="15" fill="#475569">at the service hop</text>

  <!-- ====== Counter scope ====== -->
  <text x="60" y="638" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">WHERE THE COUNTER LIVES</text>

  <rect x="330" y="656" width="290" height="70" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="475" y="686" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Per gateway node</text>
  <text x="475" y="710" text-anchor="middle" font-size="14" fill="#c2410c">never aggregated across nodes</text>

  <rect x="710" y="656" width="290" height="70" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="855" y="686" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">In memory, per replica</text>
  <text x="855" y="710" text-anchor="middle" font-size="14" fill="#c2410c">2 replicas x 10/s = 20/s, silently</text>

  <!-- Redis: the fix for the service counter -->
  <line x1="1000" y1="691" x2="1086" y2="691" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="1043" y="680" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">or</text>
  <rect x="1090" y="646" width="250" height="90" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1215" y="676" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Azure Managed Redis</text>
  <text x="1215" y="699" text-anchor="middle" font-size="14" fill="#475569">one shared counter, one Lua script</text>
  <text x="1215" y="720" text-anchor="middle" font-size="14" fill="#475569">per algorithm, one round trip per call</text>

  <!-- Footer -->
  <text x="60" y="790" font-size="15" fill="#475569">Every reject is a 429 with Retry-After, computed from the limiter's own state.</text>
  <text x="1340" y="790" text-anchor="end" font-size="14" fill="#94a3b8">sjwiggers.com</text>
</svg>
